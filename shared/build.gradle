apply plugin: 'com.android.library'

android {
    namespace 'com.chernuga.spge.shared'
    compileSdk 34

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // org.json ships with Android, but the unit tests run on the JVM where it
    // is absent, so the real implementation is supplied for tests only.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
